<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
         /* FOOTER */
         footer {
            background-color: #ffebeb;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 30px;
        }

        .f-logo {
            flex: 1;
            text-align: center;
            margin-top: 40px;
        }

        .f-logo h3 {
            font-size: 2.5em;
            font-family: 'Georgia', serif;
            margin: 0 0 5px;
            color: black;
            font-weight: bold;
            line-height: 0.5;
        }

        .f-logo p {
            font-size: 1.2em;
            font-family: 'Georgia', serif;
            font-style: italic;
            margin-top: 0;
            color: #3b3b3b;
        }

        .footer-section h3 {
            color: #e91e95;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 1.4em;
        }

        .footer-section ul {
            list-style: none;
            padding: 0;
        }

        .footer-section ul li {
            margin-bottom: 8px;
        }

        .footer-section ul li a {
            color: black;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-section ul li a:hover {
            color: rgb(243, 71, 157);
        }

        .social-icons a {
            display: inline-block;
            margin-right: 10px;
            color: rgb(179, 41, 110);
            font-size: 1.4rem;
            text-decoration: none;
        }

        .footer-section a:hover {
            color: rgb(243, 71, 157);
        }

        .footer-section a {
            color: black;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-bottom {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9rem;
            color: #726d6f;
        }

        @media (max-width: 600px) {
            .footer-container {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .footer-section {margin: 10px 0;}
        }

    </style>
</head>

    </style>
</head>

     <!--FOOTER-->
     <footer>

        <div class="footer-bottom">

        </div>
    </footer>
